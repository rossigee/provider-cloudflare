version: "2"

run:
  timeout: 5m

linters:
  enable:
    - govet
    - ineffassign
    - misspell
    - unconvert
    - unused
  exclusions:
    paths:
      - internal/controller/originssl/certificate.go
      - internal/controller/cache/cacherule_test.go

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - internal/controller/cache/cacherule_test.go
