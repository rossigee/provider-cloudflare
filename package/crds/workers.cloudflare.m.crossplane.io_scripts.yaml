---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: scripts.workers.cloudflare.m.crossplane.io
spec:
  group: workers.cloudflare.m.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - cloudflare
    kind: Script
    listKind: ScriptList
    plural: scripts
    singular: script
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.annotations.crossplane\.io/external-name
      name: EXTERNAL-NAME
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: A Script represents a Cloudflare Worker script for serverless
          edge computing.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: A ScriptSpec defines the desired state of a Worker Script.
            properties:
              forProvider:
                description: ScriptParameters are the configurable fields of a Worker
                  Script.
                properties:
                  bindings:
                    description: Bindings defines the bindings available to the Worker
                      script.
                    items:
                      description: WorkerBinding represents different types of bindings
                        available to Workers.
                      properties:
                        json:
                          description: JSON for JSON data bindings (as string).
                          type: string
                        name:
                          description: Name is the variable name used in the Worker
                            script to access this binding.
                          type: string
                        namespaceId:
                          description: NamespaceID for KV namespace bindings.
                          type: string
                        part:
                          description: Part for WASM module bindings.
                          type: string
                        text:
                          description: Text for text blob bindings.
                          type: string
                        type:
                          description: Type specifies the binding type (kv_namespace,
                            wasm_module, text_blob, json_data, etc.)
                          type: string
                      required:
                      - name
                      - type
                      type: object
                    type: array
                  compatibilityDate:
                    description: |-
                      CompatibilityDate sets the compatibility date for the Worker.
                      Format: YYYY-MM-DD
                    type: string
                  compatibilityFlags:
                    description: CompatibilityFlags enables specific compatibility
                      flags for the Worker.
                    items:
                      type: string
                    type: array
                  logPush:
                    description: LogPush indicates whether to enable log push for
                      this Worker.
                    type: boolean
                  module:
                    description: Module indicates whether this is an ES module Worker
                      (true) or service worker (false).
                    type: boolean
                  placement:
                    description: PlacementMode controls smart placement for optimal
                      performance.
                    enum:
                    - ""
                    - smart
                    type: string
                  script:
                    description: |-
                      Script is the JavaScript/WebAssembly content of the Worker.
                      This can be raw script content or base64 encoded for binary content.
                    type: string
                  scriptName:
                    description: ScriptName is the name of the Worker script.
                    type: string
                  tags:
                    description: Tags are arbitrary user-defined tags for organizing
                      Workers.
                    items:
                      type: string
                    type: array
                  tailConsumers:
                    description: TailConsumers defines Workers that will consume logs
                      from this Worker.
                    items:
                      description: TailConsumer represents a Worker that consumes
                        logs from another Worker.
                      properties:
                        environment:
                          description: Environment specifies which environment of
                            the service to use.
                          type: string
                        namespace:
                          description: Namespace specifies the Workers for Platforms
                            namespace.
                          type: string
                        service:
                          description: Service is the name of the Worker service that
                            will consume logs.
                          type: string
                      required:
                      - service
                      type: object
                    type: array
                  usageModel:
                    description: UsageModel specifies the usage model for the Worker.
                    enum:
                    - bundled
                    - unbound
                    type: string
                required:
                - script
                - scriptName
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: A ScriptStatus represents the observed state of a Worker
              Script.
            properties:
              atProvider:
                description: ScriptObservation are the observable fields of a Worker
                  Script.
                properties:
                  createdOn:
                    description: CreatedOn indicates when the script was created.
                    type: string
                  deploymentId:
                    description: DeploymentId represents the current deployment identifier.
                    type: string
                  etag:
                    description: ETAG represents the current version/state of the
                      script.
                    type: string
                  id:
                    description: ID is the unique identifier of the Worker script.
                    type: string
                  lastDeployedFrom:
                    description: LastDeployedFrom indicates the deployment source.
                    type: string
                  logPush:
                    description: LogPush indicates whether log push is enabled.
                    type: boolean
                  modifiedOn:
                    description: ModifiedOn indicates when the script was last modified.
                    type: string
                  pipeline:
                    description: Pipeline indicates if the script is part of a deployment
                      pipeline.
                    type: string
                  size:
                    description: Size is the size of the Worker script in bytes.
                    format: int64
                    type: integer
                  usageModel:
                    description: UsageModel indicates the current usage model.
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
